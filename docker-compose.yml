# Runs PostgreSQL and the DriftGuard dashboard together, fully self-contained.
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: driftguard        # only reachable inside Docker's private network
      POSTGRES_DB: driftguard
    volumes:
      - dbdata:/var/lib/postgresql/data    # database survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:driftguard@db:5432/driftguard
    ports:
      - "8501:8501"                        # dashboard at http://localhost:8501
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: